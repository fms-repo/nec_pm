<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Completion Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2B3C; --muted:#5B6E77; --border:#E1E7EA; --surface:#F6F8F9;
    --teal:#1B7A8C; --teal-dark:#0F4C5C; --navy:#1E355E; --sand:#C9A15A; --green:#2E8B57; --red:#C94C4C;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif; color:var(--ink); background:#DDE3E6; margin:0; padding:28px 0;
    -webkit-font-smoothing:antialiased;
  }
  .toolbar{
    max-width:820px; margin:0 auto 16px; display:flex; justify-content:space-between; align-items:center; padding:0 4px;
  }
  .toolbar .hint{font-size:.82rem; color:#42535C;}
  .btn{
    border:none; border-radius:8px; padding:9px 18px; font-size:.86rem; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn-print{background:var(--navy); color:#fff;}
  .btn-back{background:#fff; color:var(--ink); border:1px solid #C7D0D4; margin-right:8px;}

  .sheet{
    max-width:820px; margin:0 auto; background:#fff; padding:48px 52px; border-radius:6px;
    box-shadow:0 6px 24px rgba(11,43,60,.14);
  }
  .head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:3px solid var(--navy); padding-bottom:20px;}
  .head-left .company{font-family:'Sora',sans-serif; font-weight:800; font-size:1.1rem; color:var(--navy); max-width:280px;}
  .head-left .bu-logo{max-height:52px; max-width:240px; object-fit:contain;}
  .head-right{text-align:right;}
  .head-right .doc-title{font-family:'Sora',sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:.6px; color:var(--ink);}
  .head-right .doc-number{font-size:.92rem; font-weight:700; color:var(--teal); margin-top:4px;}
  .status-pill{display:inline-block; margin-top:8px; padding:4px 12px; border-radius:20px; font-size:.72rem; font-weight:800; letter-spacing:.4px; text-transform:uppercase;}
  .status-Draft{background:#EDEFF0; color:#5B6E77;}
  .status-Issued{background:#E3F0F7; color:#1B6FA8;}

  .cert-type-banner{
    margin-top:22px; text-align:center; padding:14px; border-radius:8px; background:var(--surface);
    border:1px solid var(--border);
  }
  .cert-type-banner .label{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .cert-type-banner .value{font-family:'Sora',sans-serif; font-weight:800; font-size:1.15rem; color:var(--navy); margin-top:3px; text-transform:uppercase; letter-spacing:.4px;}

  .certify-text{margin:24px 0; font-size:.9rem; line-height:1.75; color:#233642; text-align:justify;}
  .certify-text b{color:var(--ink);}

  .meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:22px 0;}
  .meta-block h4{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 6px;}
  .meta-block .name{font-weight:700; font-size:.92rem; margin-bottom:2px;}
  .meta-block .line{font-size:.84rem; color:#42535C; line-height:1.5;}

  .facts-row{display:flex; gap:0; margin:18px 0 6px; border:1px solid var(--border); border-radius:8px; overflow:hidden; flex-wrap:wrap;}
  .facts-row .fact{flex:1; min-width:120px; padding:10px 16px; border-right:1px solid var(--border);}
  .facts-row .fact:last-child{border-right:none;}
  .facts-row .fact h5{font-size:.64rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:0 0 4px;}
  .facts-row .fact div{font-size:.86rem; font-weight:700;}

  .dlp-box{margin-top:20px; padding:14px 16px; background:#FBF2DF; border:1px solid #EBD9AE; border-radius:8px; font-size:.82rem; color:#5C4A1E;}
  .dlp-box h4{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; margin:0 0 6px; color:#8A6D1F;}

  .items-block{margin-top:24px;}
  .items-block h4{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 8px;}
  .punch-list{margin:0; padding-left:18px; font-size:.84rem; color:#42535C; line-height:1.7;}
  .no-defects{font-size:.84rem; color:var(--green); font-weight:600;}

  .notes-block{margin-top:22px;}
  .notes-block h4{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 6px;}
  .notes-block .body{font-size:.84rem; color:#42535C; line-height:1.6; white-space:pre-line;}

  .sign-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; margin-top:56px;}
  .sign-block .line{border-top:1px solid var(--ink); margin-top:44px; padding-top:6px;}
  .sign-block .role{font-size:.68rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);}
  .sign-block .who{font-size:.82rem; font-weight:700; margin-top:2px;}
  .sign-block .title{font-size:.76rem; color:var(--muted);}

  .footer-note{margin-top:40px; padding-top:14px; border-top:1px solid var(--border); font-size:.72rem; color:var(--muted); text-align:center;}

  .loading, .error-state{max-width:820px; margin:60px auto; text-align:center; color:#42535C; font-size:.95rem;}

  @media print{
    body{background:#fff; padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none; border-radius:0; max-width:100%; padding:0 6mm; margin:0;}
    @page{ size:A4; margin:14mm 12mm; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="hint">Review the certificate below, then print or save as PDF using your browser's print dialog.</span>
    <span>
      <button class="btn btn-back" onclick="window.close()">Close</button>
      <button class="btn btn-print" id="printBtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v3H2V4zm1 5H2v3a1 1 0 0 0 1 1h1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2h1a1 1 0 0 0 1-1V9h-1M5 14v-3h6v3H5z"/></svg> Print / Save as PDF</button>
    </span>
  </div>
  <div id="root"><div class="loading">Loading certificate…</div></div>

<script src="/approval-print.js"></script>
<script>
const fmtCurrency = (v)=> 'OMR ' + (Number(v)||0).toLocaleString('en-US', {minimumFractionDigits:3, maximumFractionDigits:3});
// DD/MM/YYYY. A plain ISO date ('YYYY-MM-DD') is read as a calendar date, with no timezone shift.
const fmtDate = (s)=> { if(!s) return '—'; const iso = typeof s==='string' && s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(iso) return `${iso[3]}/${iso[2]}/${iso[1]}`; const d = new Date(s); return isNaN(d) ? '—' : `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const root = document.getElementById('root');
  if(!id){ root.innerHTML = '<div class="error-state">No certificate specified.</div>'; return; }
  let c;
  try{
    const r = await fetch(`/api/certificates/${id}`);
    if(!r.ok) throw new Error('Certificate not found');
    c = await r.json();
  }catch(e){
    root.innerHTML = `<div class="error-state">Could not load this certificate — ${e.message}.</div>`;
    return;
  }
  document.title = `Completion Certificate ${c.certificateNumber}`;
  const ap = await ApprovalPrint.load('certificate', id);

  const p = c.project || {};
  const isProvisional = c.certificateType === 'Provisional';
  const punchItems = (c.outstandingItems || '').split('\n').map(s=>s.trim()).filter(Boolean);

  const buName = p.businessUnit || 'National Sustainable Water Alliance';
  const certifyText = isProvisional
    ? `This is to certify that the works known as <b>${esc(p.name || '—')}</b> (Contract Ref / PO Ref: <b>${esc(p.contractReference || '—')}</b>), located at ${esc(p.city || '')}${p.city && p.governorate ? ', ' : ''}${esc(p.governorate || '')}, undertaken by <b>${esc(p.contractor || '—')}</b> for <b>${esc(buName)}</b>, have been inspected and found to be substantially complete and fit for their intended purpose as of <b>${fmtDate(c.completionDate)}</b>. This Provisional Completion Certificate is issued subject to the Defects Liability Period stated below, at the end of which — and upon satisfactory rectification of any outstanding items — a Final Completion Certificate will be issued.`
    : `This is to certify that the works known as <b>${esc(p.name || '—')}</b> (Contract Ref / PO Ref: <b>${esc(p.contractReference || '—')}</b>), located at ${esc(p.city || '')}${p.city && p.governorate ? ', ' : ''}${esc(p.governorate || '')}, undertaken by <b>${esc(p.contractor || '—')}</b> for <b>${esc(buName)}</b>, have been fully completed in accordance with the approved drawings, specifications and contract requirements, and all defects notified during the Defects Liability Period have been satisfactorily rectified. This Final Completion Certificate confirms the Contractor's obligations under the contract are discharged as of <b>${fmtDate(c.completionDate)}</b>.`;


  root.innerHTML = `
    <div class="sheet">
      <div class="head-row">
        <div class="head-left">
          ${p.businessUnitLogoUrl ? `<img class="bu-logo" src="${esc(p.businessUnitLogoUrl)}" alt="${esc(buName)}">` : `<div class="company">${esc(buName)}</div>`}
        </div>
        <div class="head-right">
          <div class="doc-title">COMPLETION CERTIFICATE</div>
          <div class="doc-number">${esc(c.certificateNumber)}</div>
          <div class="status-pill status-${c.status}">${esc(c.status)}</div>
        </div>
      </div>

      <div class="cert-type-banner">
        <div class="label">Certificate Type</div>
        <div class="value">${isProvisional ? 'Provisional Completion' : 'Final Completion'}</div>
      </div>

      <div class="certify-text">${certifyText}</div>

      <div class="meta-grid">
        <div class="meta-block">
          <h4>Project</h4>
          <div class="name">${esc(p.name || '—')}</div>
          <div class="line">${esc(p.governorate || '')}${p.city ? ' · ' + esc(p.city) : ''}</div>
        </div>
        <div class="meta-block">
          <h4>Contractor</h4>
          <div class="name">${esc(p.contractor || '—')}</div>
          <div class="line">${p.contractReference ? 'Contract Ref / PO Ref: ' + esc(p.contractReference) : ''}</div>
        </div>
      </div>

      <div class="facts-row">
        <div class="fact"><h5>Completion Date</h5><div>${fmtDate(c.completionDate)}</div></div>
        <div class="fact"><h5>Inspection Date</h5><div>${fmtDate(c.inspectionDate)}</div></div>
        <div class="fact"><h5>Contract Value</h5><div>${fmtCurrency(c.contractValue)}</div></div>
        <div class="fact"><h5>Final Cost</h5><div>${fmtCurrency(c.finalCost)}</div></div>
      </div>

      ${(c.defectsLiabilityStart || c.defectsLiabilityEnd) ? `
      <div class="dlp-box">
        <h4>Defects Liability Period</h4>
        From <strong>${fmtDate(c.defectsLiabilityStart)}</strong> to <strong>${fmtDate(c.defectsLiabilityEnd)}</strong>.
        The Contractor remains responsible for rectifying any defects notified during this period.
      </div>` : ''}

      <div class="items-block">
        <h4>Outstanding Items / Punch List</h4>
        ${punchItems.length
          ? `<ul class="punch-list">${punchItems.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`
          : `<div class="no-defects"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:-1px;margin-right:4px;"><path d="M13.485 1.929a1 1 0 0 1 0 1.414l-7.5 7.5a1 1 0 0 1-1.414 0l-3.5-3.5a1 1 0 1 1 1.414-1.414L5.5 8.943l6.793-6.793a1 1 0 0 1 1.414 0z"/></svg>No outstanding items — works fully complete.</div>`}
      </div>

      ${c.remarks ? `<div class="notes-block"><h4>Remarks</h4><div class="body">${esc(c.remarks)}</div></div>` : ''}

      <div class="sign-row">
        ${ApprovalPrint.signBlock(ap, 'engineer', 'Engineer / Consultant', c.engineerName, c.engineerTitle)}
        ${ApprovalPrint.signBlock(ap, 'supply_chain', 'Supply Chain Manager', c.contractorRepName, c.contractorRepTitle)}
        ${ApprovalPrint.signBlock(ap, 'client_rep', 'Client Representative', c.clientRepName, c.clientRepTitle)}
      </div>

      <div class="footer-note">This is a computer-generated completion certificate from the NEC Project Management Dashboard.</div>
    </div>
  `;
  ApprovalPrint.mountBar(ap);
}

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
load();
</script>
</body>
</html>
