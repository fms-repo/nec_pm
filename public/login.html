<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Water Rehabilitation Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{
  --navy:#1E355E;
  --lime:#8DC63F;
  --ink:#0B2B3C;
  --muted:#5B6E77;
  --border:#E1E7EA;
  --red:#C94C4C;
  --red-bg:#FBEAEA;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font-body);
  background:linear-gradient(160deg, var(--navy) 0%, #16264A 100%);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  width:100%;max-width:380px;background:#fff;border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);padding:34px 32px 30px;
}
.logo-row{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px;}
.logo-row img{height:34px;width:auto;}
.logo-sub{font-size:.72rem;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;text-align:center;}
h1{
  font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--ink);
  text-align:center;margin:0 0 4px;
}
.subtitle{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:24px;}
label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:6px;}
.field{margin-bottom:16px;}
input{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;
  font-size:.92rem;font-family:var(--font-body);color:var(--ink);
}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,53,94,.12);}
.btn-login{
  width:100%;padding:11px;border:none;border-radius:9px;background:var(--navy);color:#fff;
  font-weight:700;font-size:.92rem;margin-top:6px;cursor:pointer;transition:background .15s ease;
}
.btn-login:hover{background:#16264A;}
.btn-login:disabled{opacity:.6;cursor:default;}
.error-box{
  display:none;background:var(--red-bg);color:var(--red);border-radius:8px;padding:9px 12px;
  font-size:.8rem;margin-bottom:16px;align-items:center;gap:7px;
}
.error-box.show{display:flex;}
.footer-note{text-align:center;color:var(--muted);font-size:.7rem;margin-top:20px;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <img src="/images/logo.png" alt="Aivizion">
      <div class="logo-sub">Sultanate of Oman</div>
    </div>
    <div class="subtitle">Sign in to access the management dashboard</div>

    <div class="error-box" id="errorBox"><i class="bi bi-exclamation-circle"></i><span id="errorText"></span></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>

    <div class="footer-note">NEC AiVizion ERP</div>
  </div>

<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const errorText = document.getElementById('errorText');
const loginBtn = document.getElementById('loginBtn');

const params = new URLSearchParams(location.search);
if(params.get('expired')==='1'){
  errorText.textContent = 'Your session expired. Please sign in again.';
  errorBox.classList.add('show');
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBox.classList.remove('show');
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in…';
  try{
    const r = await fetch('/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok){
      errorText.textContent = j.error || 'Sign in failed.';
      errorBox.classList.add('show');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      return;
    }
    location.href = '/';
  }catch(err){
    errorText.textContent = 'Could not reach the server. Please try again.';
    errorBox.classList.add('show');
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
