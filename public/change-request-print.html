<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2B3C; --muted:#5B6E77; --border:#E1E7EA; --surface:#F6F8F9;
    --teal:#1B7A8C; --teal-dark:#0F4C5C; --navy:#1E355E; --sand:#C9A15A; --green:#2E8B57; --amber:#D99A22; --red:#C94C4C;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif; color:var(--ink); background:#DDE3E6; margin:0; padding:28px 0;
    -webkit-font-smoothing:antialiased;
  }
  .toolbar{ max-width:920px; margin:0 auto 16px; display:flex; justify-content:space-between; align-items:center; padding:0 4px; }
  .toolbar .hint{font-size:.82rem; color:#42535C;}
  .btn{ border:none; border-radius:8px; padding:9px 18px; font-size:.86rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn-print{background:var(--navy); color:#fff;}
  .btn-back{background:#fff; color:var(--ink); border:1px solid #C7D0D4; margin-right:8px;}

  .sheet{ max-width:920px; margin:0 auto; background:#fff; padding:40px 44px; border-radius:6px; box-shadow:0 6px 24px rgba(11,43,60,.14); }
  .head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:3px solid var(--navy); padding-bottom:16px;}
  .head-left .company{font-family:'Sora',sans-serif; font-weight:800; font-size:1.05rem; color:var(--navy); max-width:400px;}
  .head-left .bu-logo{max-height:36px; max-width:200px; object-fit:contain; margin-bottom:6px; display:block;}
  .head-left .sub{font-size:.8rem; color:var(--muted); margin-top:2px;}
  .head-right{text-align:right;}
  .head-right .doc-title{font-family:'Sora',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:.4px; color:var(--ink);}
  .head-right .doc-number{font-size:.88rem; font-weight:700; color:var(--teal); margin-top:6px;}
  .status-pill{display:inline-block; margin-top:6px; padding:4px 12px; border-radius:20px; font-size:.7rem; font-weight:800; letter-spacing:.4px; text-transform:uppercase;}
  .status-Submitted{background:#EDEFF0; color:#5B6E77;}
  .status-Under-Analysis{background:#FBF2DF; color:#8A6D1F;}
  .status-Approved{background:#DCEEE7; color:#1F6E4E;}
  .status-Rejected{background:#FBE2E2; color:#A23B3B;}
  .status-Deferred{background:#E3F0F7; color:#1B6FA8;}

  .meta-row{display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-top:14px; font-size:.8rem; color:var(--muted);}
  .meta-row b{color:var(--ink);}

  .section-label{ margin:22px 0 10px; font-family:'Sora',sans-serif; font-weight:700; font-size:.82rem; color:var(--navy); text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--border); padding-bottom:6px; }

  table.facts{width:100%; border-collapse:collapse; font-size:.82rem; margin-bottom:4px;}
  table.facts td{border:1px solid var(--border); padding:8px 10px; vertical-align:top;}
  table.facts td.k{width:24%; background:var(--surface); font-weight:700; color:#42535C;}
  table.facts td.v{width:26%;}

  .text-block{margin-top:4px; font-size:.82rem;}
  .text-block h4{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 6px;}
  .text-block .body{color:#42535C; line-height:1.6; white-space:pre-line;}

  table.grid{width:100%; border-collapse:collapse; font-size:.78rem; margin-top:6px;}
  table.grid th{background:var(--navy); color:#fff; padding:8px 9px; text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.3px;}
  table.grid td{border:1px solid var(--border); padding:8px 9px; vertical-align:top;}
  table.grid .num{text-align:right; white-space:nowrap;}
  table.grid tr:nth-child(even) td{background:var(--surface);}

  .empty-note{font-size:.78rem; color:var(--muted); font-style:italic; margin-top:6px;}

  .sign-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; margin-top:48px;}
  .sign-block .line{border-top:1px solid var(--ink); margin-top:40px; padding-top:6px;}
  .sign-block .role{font-size:.66rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);}
  .sign-block .who{font-size:.8rem; font-weight:700; margin-top:2px;}

  .footer-note{margin-top:36px; padding-top:12px; border-top:1px solid var(--border); font-size:.7rem; color:var(--muted); text-align:center;}

  .loading, .error-state{max-width:920px; margin:60px auto; text-align:center; color:#42535C; font-size:.95rem;}

  @media print{
    body{background:#fff; padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none; border-radius:0; max-width:100%; padding:0 6mm; margin:0;}
    table.grid th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    @page{ size:A4; margin:12mm 11mm; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="hint">Review the change request below, then print or save as PDF using your browser's print dialog.</span>
    <span>
      <button class="btn btn-back" onclick="window.close()">Close</button>
      <button class="btn btn-print" id="printBtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v3H2V4zm1 5H2v3a1 1 0 0 0 1 1h1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2h1a1 1 0 0 0 1-1V9h-1M5 14v-3h6v3H5z"/></svg> Print / Save as PDF</button>
    </span>
  </div>
  <div id="root"><div class="loading">Loading change request…</div></div>

<script src="/approval-print.js"></script>
<script>
const fmtCurrency = (v)=> 'OMR ' + (Number(v)||0).toLocaleString('en-US', {minimumFractionDigits:3, maximumFractionDigits:3});
// DD/MM/YYYY. A plain ISO date ('YYYY-MM-DD') is read as a calendar date, with no timezone shift.
const fmtDate = (s)=> { if(!s) return '—'; const iso = typeof s==='string' && s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(iso) return `${iso[3]}/${iso[2]}/${iso[1]}`; const d = new Date(s); return isNaN(d) ? '—' : `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const root = document.getElementById('root');
  if(!id){ root.innerHTML = '<div class="error-state">No change request specified.</div>'; return; }
  let cr;
  try{
    const r = await fetch(`/api/change-requests/${id}`);
    if(!r.ok) throw new Error('Change request not found');
    cr = await r.json();
  }catch(e){
    root.innerHTML = `<div class="error-state">Could not load this change request — ${e.message}.</div>`;
    return;
  }
  document.title = `Change Request ${cr.crCode}`;
  const ap = await ApprovalPrint.load('change_request', id);

  const analyses = cr.analyses || [];
  const decisions = cr.decisions || [];
  const statusClass = 'status-' + String(cr.status).replace(/\s+/g,'-');
  const isApproved = cr.status === 'Approved';

  root.innerHTML = `
    <div class="sheet">
      <div class="head-row">
        <div class="head-left">
          ${cr.businessUnitLogoUrl ? `<img class="bu-logo" src="${esc(cr.businessUnitLogoUrl)}" alt="${esc(cr.businessUnit || '')}">` : ''}
          <div class="company">${esc(cr.projectName || '—')}</div>
          <div class="sub">${esc(cr.projectCode || '')}</div>
        </div>
        <div class="head-right">
          <div class="doc-title">CHANGE REQUEST</div>
          <div class="doc-number">${esc(cr.crCode)}</div>
          <div class="status-pill ${statusClass}">${esc(cr.status)}</div>
        </div>
      </div>

      <div class="meta-row">
        <div>CR Type: <b>${esc(cr.crSource || 'Client')}</b></div>
        <div>Change Category: <b>${esc(cr.crType)}</b></div>
        <div>Priority: <b>${esc(cr.priority)}</b></div>
        <div>Date Submitted: <b>${fmtDate(cr.dateSubmitted)}</b></div>
        <div>Date Required: <b>${fmtDate(cr.dateRequired)}</b></div>
      </div>

      <div class="section-label">A — Change Request Details</div>
      <table class="facts">
        <tr>
          <td class="k">Submitter Name</td><td class="v">${esc(cr.submitterName || '—')}</td>
          <td class="k">Contract Ref / PO Ref</td><td class="v">${esc(cr.contractReference || '—')}</td>
        </tr>
        <tr>
          <td class="k">Original Completion Date</td><td class="v">${fmtDate(cr.originalCompletionDate)}</td>
          <td class="k">Revised Completion Date</td><td class="v"><strong>${fmtDate(cr.revisedCompletionDate)}</strong></td>
        </tr>
        <tr>
          <td class="k">Original Contract Value</td><td class="v">${fmtCurrency(cr.originalContractValue)}</td>
          <td class="k">Revised Contract Value</td><td class="v"><strong>${fmtCurrency(cr.revisedContractValue)}</strong></td>
        </tr>
        <tr>
          <td class="k">Cost Impact (This CR)</td>
          <td class="v"${cr.crSource === 'Subcontractor' ? '' : ' colspan="3"'}>${fmtCurrency(cr.crCostImpact)}${!isApproved && cr.crCostImpact ? ` <span style="color:var(--muted);font-size:.72rem;">(${cr.status==='Rejected' ? 'rejected' : cr.status==='Deferred' ? 'deferred' : 'pending CCB approval'} — excluded from Revised Contract Value)</span>` : ''}</td>
          ${cr.crSource === 'Subcontractor' ? `<td class="k">Subcontractor</td><td class="v">${esc(cr.subcontractorName || '—')}</td>` : ''}
        </tr>
      </table>
      <div style="font-size:.68rem;color:var(--muted);margin-top:4px;">Revised figures include every approved change request on this project up to and including this one. Original figures are from the Project Brief.</div>
      <div class="text-block"><h4>Brief Description of Request</h4><div class="body">${esc(cr.description || '—')}</div></div>
      ${cr.reasonForChange ? `<div class="text-block"><h4>Reason for Change</h4><div class="body">${esc(cr.reasonForChange)}</div></div>` : ''}
      ${cr.assumptionsNotes ? `<div class="text-block"><h4>Assumptions and Notes</h4><div class="body">${esc(cr.assumptionsNotes)}</div></div>` : ''}
      ${cr.comments ? `<div class="text-block"><h4>Comments</h4><div class="body">${esc(cr.comments)}</div></div>` : ''}

      <div class="section-label">B — Initial Analysis</div>
      ${analyses.length ? `
      <table class="grid">
        <thead><tr>
          <th>Category</th><th>Sub Category</th><th>Schedule Impact</th><th class="num">Months</th><th class="num">Days</th>
          <th class="num">Cost Impact</th><th>Comments</th><th>Recommendations</th>
        </tr></thead>
        <tbody>
          ${analyses.map(a=>`<tr>
            <td>${esc(a.category)}</td><td>${esc(a.subCategory||'—')}</td>
            <td>${esc(a.scheduleImpact)}</td><td class="num">${Number(a.durationMonths)||0}</td><td class="num">${Number(a.durationDays)||0}</td>
            <td class="num">${fmtCurrency(a.costImpact)}</td>
            <td>${esc(a.comments||'—')}</td><td>${esc(a.recommendations||'—')}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty-note">No initial analysis recorded yet.</div>`}

      <div class="section-label">C — Change Control Board Decision${decisions.length>1?'s':''}</div>
      ${decisions.length ? `
      <table class="grid">
        <thead><tr>
          <th>Decision</th><th>Decision Date</th><th>Decision Explanation</th>
        </tr></thead>
        <tbody>
          ${decisions.map(d=>`<tr>
            <td>${esc(d.decision)}</td><td>${fmtDate(d.decisionDate)}</td>
            <td>${esc(d.decisionExplanation||'—')}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty-note">No Change Control Board decision recorded yet.</div>`}

      <div class="sign-row">
        ${ApprovalPrint.signBlock(ap, 'submitter', cr.submitterName)}
        ${ApprovalPrint.signBlock(ap, 'reviewer', cr.reviewedByName)}
        ${ApprovalPrint.signBlock(ap, 'ccb', cr.ccbApprovedByName)}
      </div>

      <div class="footer-note">This is a computer-generated change request record from the NEC Project Management Dashboard.</div>
    </div>
  `;
  ApprovalPrint.mountBar(ap);
}

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
load();
</script>
</body>
</html>
