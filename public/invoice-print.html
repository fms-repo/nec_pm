<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2B3C; --muted:#5B6E77; --border:#E1E7EA; --surface:#F6F8F9;
    --teal:#1B7A8C; --teal-dark:#0F4C5C; --sand:#C9A15A; --green:#2E8B57; --red:#C94C4C;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif; color:var(--ink); background:#DDE3E6; margin:0; padding:28px 0;
    -webkit-font-smoothing:antialiased;
  }
  .toolbar{
    max-width:820px; margin:0 auto 16px; display:flex; justify-content:space-between; align-items:center; padding:0 4px;
  }
  .toolbar .hint{font-size:.82rem; color:#42535C;}
  .btn{
    border:none; border-radius:8px; padding:9px 18px; font-size:.86rem; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn-print{background:var(--teal); color:#fff;}
  .btn-back{background:#fff; color:var(--ink); border:1px solid #C7D0D4; margin-right:8px;}

  .sheet{
    max-width:820px; margin:0 auto; background:#fff; padding:48px 52px; border-radius:6px;
    box-shadow:0 6px 24px rgba(11,43,60,.14);
  }
  .head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:3px solid var(--teal-dark); padding-bottom:20px;}
  .head-left .company{font-family:'Sora',sans-serif; font-weight:800; font-size:1.1rem; color:var(--teal-dark); max-width:280px;}
  .head-left .bu-logo{max-height:52px; max-width:240px; object-fit:contain;}
  .head-left .company-sub{font-size:.8rem; color:var(--muted); margin-top:2px; white-space:pre-line;}
  .head-right{text-align:right;}
  .head-right .doc-title{font-family:'Sora',sans-serif; font-weight:800; font-size:1.6rem; letter-spacing:1px; color:var(--ink);}
  .head-right .doc-number{font-size:.92rem; font-weight:700; color:var(--teal); margin-top:4px;}
  .status-pill{display:inline-block; margin-top:8px; padding:4px 12px; border-radius:20px; font-size:.72rem; font-weight:800; letter-spacing:.4px; text-transform:uppercase;}
  .status-Draft{background:#EDEFF0; color:#5B6E77;}
  .status-Issued{background:#E3F0F7; color:#1B6FA8;}
  .status-Paid{background:#E3F3E9; color:#2E8B57;}
  .status-Cancelled{background:#FBEAEA; color:#C94C4C;}

  .meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:24px 0;}
  .meta-block h4{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 6px;}
  .meta-block .name{font-weight:700; font-size:.96rem; margin-bottom:2px;}
  .meta-block .line{font-size:.84rem; color:#42535C; line-height:1.5;}

  .facts-row{display:flex; gap:0; margin:18px 0 26px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .facts-row .fact{flex:1; padding:10px 16px; border-right:1px solid var(--border);}
  .facts-row .fact:last-child{border-right:none;}
  .facts-row .fact h5{font-size:.64rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:0 0 4px;}
  .facts-row .fact div{font-size:.86rem; font-weight:700;}

  table.items{width:100%; border-collapse:collapse; margin-top:6px; font-size:.82rem;}
  table.items thead th{
    background:var(--teal-dark); color:#fff; text-align:left; padding:9px 10px; font-size:.68rem;
    text-transform:uppercase; letter-spacing:.4px; font-weight:700;
  }
  table.items thead th.num{text-align:right;}
  table.items tbody td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  table.items tbody td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  table.items tbody tr:nth-child(even){background:#FAFBFB;}
  table.items .stage-tag{font-size:.68rem; color:var(--muted);}

  .totals-wrap{display:flex; justify-content:flex-end; margin-top:16px;}
  .totals{width:290px;}
  .totals .row{display:flex; justify-content:space-between; padding:6px 0; font-size:.86rem;}
  .totals .row.grand{
    border-top:2px solid var(--teal-dark); margin-top:6px; padding-top:12px; font-size:1.15rem; font-weight:800; color:var(--teal-dark);
  }
  .totals .row span:last-child{font-variant-numeric:tabular-nums; font-weight:600;}

  .notes-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:30px;}
  .notes-block h4{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 6px;}
  .notes-block .body{font-size:.82rem; color:#42535C; line-height:1.6; white-space:pre-line;}

  .sign-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; margin-top:56px;}
  .sign-block .line{border-top:1px solid var(--ink); margin-top:44px; padding-top:6px; font-size:.76rem; color:var(--muted);}

  .footer-note{margin-top:40px; padding-top:14px; border-top:1px solid var(--border); font-size:.72rem; color:var(--muted); text-align:center;}

  .loading, .error-state{max-width:820px; margin:60px auto; text-align:center; color:#42535C; font-size:.95rem;}

  @media print{
    body{background:#fff; padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none; border-radius:0; max-width:100%; padding:0 6mm; margin:0;}
    @page{ size:A4; margin:14mm 12mm; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="hint">Review the invoice below, then print or save as PDF using your browser's print dialog.</span>
    <span>
      <button class="btn btn-back" onclick="window.close()">Close</button>
      <button class="btn btn-print" id="printBtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v3H2V4zm1 5H2v3a1 1 0 0 0 1 1h1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2h1a1 1 0 0 0 1-1V9h-1M5 14v-3h6v3H5z"/></svg> Print / Save as PDF</button>
    </span>
  </div>
  <div id="root"><div class="loading">Loading invoice…</div></div>

<script>
const fmtCurrency = (v)=> 'OMR ' + (Number(v)||0).toLocaleString('en-US', {minimumFractionDigits:3, maximumFractionDigits:3});
// DD/MM/YYYY. A plain ISO date ('YYYY-MM-DD') is read as a calendar date, with no timezone shift.
const fmtDate = (s)=> { if(!s) return '—'; const iso = typeof s==='string' && s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(iso) return `${iso[3]}/${iso[2]}/${iso[1]}`; const d = new Date(s); return isNaN(d) ? '—' : `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };

async function load(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const root = document.getElementById('root');
  if(!id){ root.innerHTML = '<div class="error-state">No invoice specified.</div>'; return; }
  let inv;
  try{
    const r = await fetch(`/api/invoices/${id}`);
    if(!r.ok) throw new Error('Invoice not found');
    inv = await r.json();
  }catch(e){
    root.innerHTML = `<div class="error-state">Could not load this invoice — ${e.message}.</div>`;
    return;
  }
  document.title = `Invoice ${inv.invoiceNumber}`;

  const isLine = inv.marginMode === 'line';
  const marginLabel = inv.marginMode === 'global'
    ? `Margin (${inv.globalMarginType === 'percent' ? inv.globalMarginValue + '%' : fmtCurrency(inv.globalMarginValue)})`
    : 'Margin';

  root.innerHTML = `
    <div class="sheet">
      <div class="head-row">
        <div class="head-left">
          ${inv.project?.businessUnitLogoUrl ? `<img class="bu-logo" src="${esc(inv.project.businessUnitLogoUrl)}" alt="${esc(inv.project?.businessUnit || '')}">` : `<div class="company">${esc(inv.project?.businessUnit || 'National Sustainable Water Alliance')}</div>`}
        </div>
        <div class="head-right">
          <div class="doc-title">INVOICE</div>
          <div class="doc-number">${esc(inv.invoiceNumber)}</div>
          <div class="status-pill status-${inv.status}">${esc(inv.status)}</div>
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-block">
          <h4>Bill To</h4>
          <div class="name">${esc(inv.billToName || '—')}</div>
          <div class="line">${esc(inv.billToAddress || '')}${inv.billToContact ? '<br>' + esc(inv.billToContact) : ''}</div>
        </div>
        <div class="meta-block">
          <h4>Project Reference</h4>
          <div class="name">${esc(inv.project?.name || '—')}</div>
          <div class="line">
            ${esc(inv.project?.governorate || '')}${inv.project?.contractReference ? ' · Contract Ref / PO Ref: ' + esc(inv.project.contractReference) : ''}
          </div>
        </div>
      </div>

      <div class="facts-row">
        <div class="fact"><h5>Invoice Date</h5><div>${fmtDate(inv.invoiceDate)}</div></div>
        <div class="fact"><h5>Due Date</h5><div>${fmtDate(inv.dueDate)}</div></div>
        <div class="fact"><h5>Payment Terms</h5><div>${esc(inv.paymentTerms || '—')}</div></div>
        <div class="fact"><h5>VAT Rate</h5><div>${inv.vatRate}%</div></div>
      </div>

      <table class="items">
        <thead>
          <tr>
            <th style="width:26px;">#</th>
            <th>Description</th>
            <th class="num">Qty</th>
            <th>Unit</th>
            <th class="num">Rate</th>
            <th class="num">Amount</th>
            ${isLine ? '<th class="num">Margin</th>' : ''}
            <th class="num">Line Total</th>
          </tr>
        </thead>
        <tbody>
          ${inv.items.map((it, i) => `
            <tr>
              <td>${i + 1}</td>
              <td>${esc(it.description)}${it.stage ? `<br><span class="stage-tag">${esc(it.stage)}</span>` : ''}</td>
              <td class="num">${it.quantity}</td>
              <td>${esc(it.unit || '—')}</td>
              <td class="num">${fmtCurrency(it.unitRate)}</td>
              <td class="num">${fmtCurrency(it.baseAmount)}</td>
              ${isLine ? `<td class="num">${fmtCurrency(it.marginAmount)}</td>` : ''}
              <td class="num"><strong>${fmtCurrency(it.lineTotal)}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>

      <div class="totals-wrap">
        <div class="totals">
          <div class="row"><span>Subtotal</span><span>${fmtCurrency(inv.subtotal)}</span></div>
          <div class="row"><span>${marginLabel}</span><span>${fmtCurrency(inv.marginTotal)}</span></div>
          <div class="row"><span>VAT (${inv.vatRate}%)</span><span>${fmtCurrency(inv.vatAmount)}</span></div>
          <div class="row grand"><span>Total Due</span><span>${fmtCurrency(inv.grandTotal)}</span></div>
        </div>
      </div>

      <div class="notes-grid">
        ${inv.bankDetails ? `<div class="notes-block"><h4>Payment Details</h4><div class="body">${esc(inv.bankDetails)}</div></div>` : '<div></div>'}
        ${inv.notes ? `<div class="notes-block"><h4>Notes</h4><div class="body">${esc(inv.notes)}</div></div>` : '<div></div>'}
      </div>

      <div class="sign-row">
        <div class="sign-block"><div class="line">Prepared By</div></div>
        <div class="sign-block"><div class="line">Approved By (Contractor)</div></div>
        <div class="sign-block"><div class="line">Received / Certified By (Client)</div></div>
      </div>

      <div class="footer-note">This is a computer-generated invoice from the NEC Project Management Dashboard.</div>
    </div>
  `;
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
load();
</script>
</body>
</html>
