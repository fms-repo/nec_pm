<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{
  --ink:#0B2B3C; --muted:#5B6E77; --teal:#1B7A8C; --teal-dark:#155F6E; --teal-light:#E4F1F3; --line:#DDE4E7; --surface:#EEF2F3;
  --good:#2E8B57; --good-bg:#E7F4EC; --good-fg:#1F6B43;
  --warn:#D99A22; --warn-bg:#FBF2DF; --warn-fg:#8A5A00;
  --bad:#C94C4C;  --bad-bg:#FBEAEA;  --bad-fg:#9E2B2B;
  --info:#1B7A8C; --info-bg:#E4F1F3; --info-fg:#155F6E;
  --muted-bg:#EDEFF1; --muted-fg:#5B6E77;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--surface);font-size:12px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif;margin:0;}

/* ---- toolbar (screen only) ---- */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;}
.bar .ttl{font-weight:700;font-size:.9rem;margin-right:auto;min-width:0;}
.bar .ttl small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;}
.bar a,.bar button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 13px;font-size:.78rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.bar a:hover,.bar button:hover{border-color:var(--teal);color:var(--teal-dark);}
.bar .primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.bar .primary:hover{background:var(--teal-dark);color:#fff;}
.state{max-width:560px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted);}
.state i{font-size:1.8rem;color:var(--teal);display:block;margin-bottom:8px;}

/* ---- the paper ---- */
.rd-doc{max-width:1123px;margin:22px auto 60px;background:#fff;box-shadow:0 2px 18px rgba(11,43,60,.12);padding:34px 40px 40px;}
.rd-brand{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--teal-dark);font-size:1.05rem;}
.rd-brand img{height:42px;max-width:150px;object-fit:contain;}
.rd-head{display:flex;gap:24px;align-items:flex-start;border-bottom:3px solid var(--teal);padding-bottom:14px;margin-bottom:6px;}
.rd-head-main{flex:1;min-width:0;}
.rd-eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--teal-dark);}
.rd-head h1{font-size:1.55rem;line-height:1.2;margin:2px 0 6px;}
.rd-meta{font-size:.78rem;color:var(--ink);} .rd-meta b{color:var(--muted);font-weight:600;margin-right:3px;}
.rd-sep{margin:0 8px;color:var(--muted);}
.rd-gen{font-size:.7rem;color:var(--muted);margin-top:3px;}

.rd-cover{min-height:700px;display:flex;flex-direction:column;border-top:10px solid var(--teal);padding:26px 4px 6px;page-break-after:always;break-after:page;}
.rd-cover .rd-brand{font-size:1.2rem;} .rd-cover .rd-brand img{height:60px;max-width:200px;}
.rd-cover-mid{margin:70px 0 36px;max-width:760px;}
.rd-cover h1{font-size:2.5rem;line-height:1.1;margin:8px 0 14px;}
.rd-cover-scope{font-size:1.2rem;font-weight:600;color:var(--teal-dark);margin-bottom:10px;}
.rd-cover-meta{font-size:.92rem;color:var(--muted);line-height:1.7;}
.rd-contents{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;column-count:2;column-gap:40px;}
.rd-contents h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px;column-span:all;}
.rd-contents ol{margin:0;padding-left:20px;font-size:.85rem;line-height:1.9;} .rd-contents a{color:var(--ink);text-decoration:none;}
.rd-cover-foot{margin-top:18px;font-size:.72rem;color:var(--muted);}

.rd-sec{margin-top:22px;}
.rd-sec h2{font-size:.98rem;color:var(--teal-dark);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:10px;break-after:avoid;page-break-after:avoid;}
.rd-sec.k-kpis h2{color:var(--ink);}
.rd-break{break-before:page;page-break-before:always;}
.rd-scope-grid{display:flex;gap:22px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);} .rd-scope-grid b{color:var(--ink);font-size:.95rem;}
.rd-projects{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;} .rd-projects span{background:var(--surface);border-radius:20px;padding:2px 10px;font-size:.7rem;color:var(--ink);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.rd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.rd-kpi{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;break-inside:avoid;background:#fff;}
.rd-kpi-v{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:700;line-height:1.15;word-break:break-word;}
.rd-kpi-l{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.35px;color:var(--muted);margin-top:4px;}
.rd-kpi-s{font-size:.7rem;color:var(--muted);margin-top:3px;}
.rd-kpi.t-good{border-left-color:var(--good);} .rd-kpi.t-warn{border-left-color:var(--warn);} .rd-kpi.t-bad{border-left-color:var(--bad);} .rd-kpi.t-info{border-left-color:var(--info);}
.rd-kpi.t-good .rd-kpi-v{color:var(--good-fg);} .rd-kpi.t-warn .rd-kpi-v{color:var(--warn-fg);} .rd-kpi.t-bad .rd-kpi-v{color:var(--bad-fg);}

.rd-table{width:100%;border-collapse:collapse;font-size:.74rem;}
.rd-table thead{display:table-header-group;}
.rd-table th{background:var(--teal-light);color:var(--teal-dark);font-size:.66rem;text-transform:uppercase;letter-spacing:.3px;padding:6px 7px;border-bottom:2px solid var(--teal);vertical-align:bottom;}
.rd-table td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top;}
.rd-table tbody tr:nth-child(even){background:#FAFCFC;}
.rd-table tr{break-inside:avoid;page-break-inside:avoid;}
.rd-table .rd-total td{font-weight:700;border-top:2px solid var(--ink);background:var(--surface);}
.a-left{text-align:left;} .a-right{text-align:right;font-variant-numeric:tabular-nums;} .a-center{text-align:center;}
.rd-nil{color:#A3B0B6;}
.rd-chip{display:inline-block;border-radius:20px;padding:1px 9px;font-weight:700;font-size:.7rem;white-space:nowrap;} .rd-chip small{font-weight:600;opacity:.85;}
.rd-tone{font-weight:700;}
.rd-chip.t-good{background:var(--good-bg);color:var(--good-fg);} .rd-chip.t-warn{background:var(--warn-bg);color:var(--warn-fg);} .rd-chip.t-bad{background:var(--bad-bg);color:var(--bad-fg);} .rd-chip.t-info{background:var(--info-bg);color:var(--info-fg);} .rd-chip.t-muted{background:var(--muted-bg);color:var(--muted-fg);}
.rd-tone.t-good{color:var(--good-fg);} .rd-tone.t-warn{color:var(--warn-fg);} .rd-tone.t-bad{color:var(--bad-fg);} .rd-tone.t-info{color:var(--info-fg);} .rd-tone.t-muted{color:var(--muted-fg);}
.rd-note{font-size:.68rem;color:var(--muted);margin-top:6px;font-style:italic;line-height:1.5;}
.rd-empty{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:.78rem;background:#FAFCFC;}

.rd-stack{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--surface);}
.rd-stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.72rem;min-width:22px;}
.rd-stack .t-good,.rd-legend .t-good{background:var(--good);} .rd-stack .t-warn,.rd-legend .t-warn{background:var(--warn);} .rd-stack .t-bad,.rd-legend .t-bad{background:var(--bad);} .rd-stack .t-info,.rd-legend .t-info{background:var(--info);} .rd-stack .t-muted,.rd-legend .t-muted{background:#8A97A0;}
.rd-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:7px;font-size:.74rem;color:var(--muted);} .rd-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;} .rd-legend b{color:var(--ink);}
.rd-bullets{list-style:none;margin:0;padding:0;display:grid;gap:7px;}
.rd-bullets li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;font-size:.82rem;break-inside:avoid;}
.rd-bullets li i{flex:0 0 9px;height:9px;border-radius:50%;margin-top:5px;}
.rd-bullets .t-good{background:var(--good-bg);} .rd-bullets .t-good i{background:var(--good);} .rd-bullets .t-warn{background:var(--warn-bg);} .rd-bullets .t-warn i{background:var(--warn);}
.rd-bullets .t-bad{background:var(--bad-bg);} .rd-bullets .t-bad i{background:var(--bad);} .rd-bullets .t-muted,.rd-bullets .t-info{background:var(--info-bg);} .rd-bullets .t-muted i,.rd-bullets .t-info i{background:var(--info);}
.rd-text{margin:0;font-size:.85rem;} .rd-text.t-bad{color:var(--bad-fg);}

/* compact layout: tighter, smaller */
.layout-compact{padding:22px 26px;} .layout-compact .rd-sec{margin-top:14px;} .layout-compact .rd-table{font-size:.68rem;} .layout-compact .rd-table td{padding:3px 6px;} .layout-compact .rd-head h1{font-size:1.25rem;} .layout-compact .rd-kpi-v{font-size:1.05rem;}

@page{size:A4 landscape;margin:12mm 12mm 16mm;
  @bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:8pt;color:#5B6E77;font-family:Inter,sans-serif;}}
.rd-foot{display:none;}
@media print{
  body{background:#fff;font-size:10.5px;}
  .bar,.state{display:none !important;}
  .rd-doc{box-shadow:none;margin:0;padding:0;max-width:none;}
  .rd-cover{min-height:170mm;}
  .rd-contents a{color:#000;}
  .rd-foot{display:block;position:fixed;left:0;right:0;bottom:-12mm;font-size:8pt;color:#5B6E77;}
}
@media (max-width:760px){.rd-doc{padding:18px 14px;margin:10px 0 40px;}.rd-head{flex-direction:column;}.rd-cover h1{font-size:1.7rem;}.rd-contents{column-count:1;}.rd-table{display:block;overflow-x:auto;}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <div class="ttl" id="barTitle">Report<small></small></div>
  <button type="button" class="primary" id="btnPrint"><i class="bi bi-printer"></i>Print / Save as PDF</button>
  <a id="btnExcel" href="#"><i class="bi bi-file-earmark-excel"></i>Excel</a>
  <button type="button" id="btnClose"><i class="bi bi-x-lg"></i>Close</button>
</div>
<div class="rd-foot" id="foot"></div>
<div id="out"><div class="state"><i class="bi bi-hourglass-split"></i>Opening the report…</div></div>

<script src="/report-render.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search), id = Number(params.get('run'));
  const out = document.getElementById('out');
  const fail = (title, msg) => { out.innerHTML = `<div class="state"><i class="bi bi-exclamation-circle"></i><b>${ReportRender.esc(title)}</b><br>${ReportRender.esc(msg || '')}<br><br><a href="/" style="color:#1B7A8C;font-weight:600;">Back to the dashboard</a></div>`; };
  if(!id){ fail('No report chosen', 'Open a report from the Report Library.'); return; }
  let lastPrintLog = 0;
  function logPrint(){
    if(Date.now() - lastPrintLog < 8000) return; lastPrintLog = Date.now();
    fetch(`/api/reports/runs/${id}/log`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'print' }) }).catch(()=>{});
  }
  fetch(`/api/reports/runs/${id}`).then(async r => {
    if(r.status === 401){ location.href = '/login.html'; return; }
    const j = await r.json().catch(()=>({}));
    if(!r.ok) return fail(r.status === 404 ? 'This report is not available' : 'Could not open the report', j.error || (r.status === 404 ? 'It may have been removed, or it covers projects your login cannot see.' : ''));
    const { meta, doc } = j;
    if(!doc) return fail('This report could not be read', 'Its stored copy is damaged. Generate it again from the Report Library.');
    document.title = `${doc.title} — ${meta.ref}`;
    document.getElementById('foot').textContent = `${doc.brand ? doc.brand.name : 'NEC'} · ${doc.title} · ${meta.ref} v${meta.version} · Confidential`;
    document.getElementById('barTitle').innerHTML = `${ReportRender.esc(doc.title)}<small>${ReportRender.esc(meta.ref)} · version ${meta.version} · ${ReportRender.esc(doc.scope.label)}</small>`;
    document.getElementById('btnExcel').href = `/api/reports/runs/${id}/excel`;
    document.getElementById('bar').hidden = false;
    out.innerHTML = ReportRender.renderDoc(doc, meta);
  }).catch(() => fail('Could not reach the server', 'Check your connection and reload.'));
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  window.addEventListener('beforeprint', logPrint);
  document.getElementById('btnClose').addEventListener('click', () => { window.close(); setTimeout(() => { location.href = '/'; }, 150); });
})();
</script>
</body>
</html>
